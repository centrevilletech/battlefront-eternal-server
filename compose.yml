services:
  server:
    build: .
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    volumes:
      - state:/data
      # Game data prepared from your own copy of the game (config.json "data", or BFE_DATA_DIR):
      # - /path/to/prepared-data:/game-data:ro
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  state:
