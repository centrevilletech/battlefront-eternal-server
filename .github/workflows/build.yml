name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: "Deploy main without the test matrix (play-testing only)"
        type: boolean
        default: false
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
# A fast deploy skips the three-platform test matrix: a main push whose
# message contains [fast], or a manual run with the fast input. The image
# build and the health-gated rollout still run.
jobs:
  test:
    if: ${{ !(inputs.fast || contains(github.event.head_commit.message, '[fast]')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  image:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/centrevilletech/battlefront-eternal-server:sha-${{ github.sha }}
  deploy:
    needs: image
    if: ${{ always() && needs.image.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, aldine, deploy, bfe-server]
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/scripts/deploy.sh
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          APP_IMAGE: ghcr.io/centrevilletech/battlefront-eternal-server:sha-${{ github.sha }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' }}
